<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17110c" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <link rel="icon" href="data:," />
  <link rel="preload" href="./assets/fonts/cormorant-garamond-cyrillic-500-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./assets/fonts/CormorantGaramond-Bold.ttf" as="font" type="font/ttf" crossorigin />
  <title>МИДИС — сцена</title>
  <style>html{background:#17110c}body{margin:0}#intro-cover{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none;background:#170f09}</style>
</head>
<body>
  <div class="scene-viewport"><canvas id="scene" role="img" aria-label="Персей с золотой чашей и монетами"></canvas></div>
  <canvas id="intro-cover" aria-hidden="true"></canvas>
  <div class="louver-controls" data-intro-ui inert>
    <div class="brand-lockup">
      <a class="louver-button louver-brand" href="#hero" aria-label="МИДИС — первый экран"><span>МИДИС</span></a>
    </div>
    <div class="louver-actions">
      <button class="louver-button louver-booking" type="button"><i aria-hidden="true"></i><span>Забронировать ПК</span></button>
      <button class="louver-button louver-menu" type="button" aria-label="Открыть меню" aria-haspopup="dialog" aria-expanded="false" aria-controls="site-menu"><span>Меню</span></button>
    </div>
  </div>
  <dialog class="site-menu" id="site-menu" aria-label="Меню">
    <button class="louver-button louver-menu site-menu-close" type="button" aria-label="Закрыть меню" autofocus><span>Закрыть</span></button>
  </dialog>
  <nav class="chapter-index" aria-label="Разделы сайта" data-intro-ui inert>
    <a href="#hero" aria-label="Первый экран" aria-current="location"><span>I</span></a>
    <span class="chapter-track" aria-hidden="true"><i></i></span>
    <a href="#second-screen" aria-label="Второй экран"><span>II</span></a>
  </nav>
  <main aria-label="Художественная сцена" data-intro-ui inert>
    <section class="hero" id="hero" aria-labelledby="hero-title">
      <div class="hero-opening">
        <h1 class="hero-wordmark" id="hero-title">МИДИС</h1>
        <p class="hero-caption">КОМПЬЮТЕРНЫЙ КЛУБ · САРАТОВ</p>
        <span class="scroll-cue" aria-hidden="true">
          <svg viewBox="0 0 28 44" fill="none"><rect x="3" y="2" width="22" height="39" rx="11"/><path class="scroll-cue-wheel" d="M14 10v7"/></svg>
        </span>
      </div>
      <div class="hero-story">
        <h2 class="hero-story-title" aria-label="Взойди на Олимп">Взойди на <em><span>О</span>лимп</em></h2>
        <p class="hero-narrative"><strong>Займи своё место среди лучших.</strong> Побеждай в любимых играх на самом топовом железе в&nbsp;Саратове. Поднимайся в рейтинге клуба, забирай награды из&nbsp;чаши&nbsp;Персея.</p>
        <div class="hero-media-placeholder" role="img" aria-label="Место для видео клуба"></div>
      </div>
    </section>
    <section class="second-screen" id="second-screen" aria-label="Второй экран"></section>
  </main>
  <div class="film-grain" aria-hidden="true"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
